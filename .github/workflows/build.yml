name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Create app project
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core @capacitor/android
          npm i -D @capacitor/cli
          mkdir www
          cp ../index.html www/index.html
          npx cap init ZeroTerritory com.wlsdnr361.zeroterritory --web-dir=www
          npx cap add android
          sed -i '0,/<activity/s//<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/>ZeroTerritory</>제로영토</g' android/app/src/main/res/values/strings.xml
          npx cap sync android

      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../zero-territory.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 제로영토 앱 ${{ github.run_number }}
          files: zero-territory.apk
